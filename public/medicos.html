  <link rel="dns-prefetch" href="https://xgfwcrdrkzcoxepnicfb.supabase.co" />
  <meta name="description" content="Gestiona los médicos y horarios de atención en CliniAgenda. Configura especialidades y disponibilidad." />

  <meta property="og:type" content="website" />

  <meta property="og:site_name" content="CliniAgenda" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Médicos | CliniAgenda" />

</head>
<body data-title="Médicos">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <h2 style="margin-bottom:12px">Médicos y horarios</h2>
        <div class="toolbar">
          <div class="left">
            <input type="search" id="buscar" class="search-input" placeholder="Buscar por nombre, especialidad o email..." aria-label="Buscar médicos" />
          </div>
          <div class="right">
            <button class="btn" onclick="abrirModalMedico()">➕ Nuevo médico</button>
          </div>
        </div>
        <div id="tabla-medicos"></div>
        <nav class="seo-links" style="margin-top:24px; padding:12px; border-top:1px solid var(--border); font-size:13px; color:var(--text-muted);" aria-label="Enlaces internos">
          <a href="dashboard.html" style="margin-right:12px;">Inicio</a>
          <a href="citas.html" style="margin-right:12px;">Citas</a>
          <a href="calendario.html" style="margin-right:12px;">Calendario</a>
          <a href="pacientes.html" style="margin-right:12px;">Pacientes</a>
          <a href="medicos.html">Médicos</a>
        </nav>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal large">
      <h3 id="modal-titulo">Nuevo médico</h3>
      <input type="hidden" id="m-id" />
      <div class="form-row">
        <div class="field">
          <label for="m-nombre">Nombre completo *</label>
          <input id="m-nombre" required />
        </div>
        <div class="field">
          <label for="m-especialidad">Especialidad *</label>
          <input id="m-especialidad" placeholder="Ej. Psicología" required />
        </div>
        <div class="field">
          <label for="m-telefono">Teléfono</label>
          <input id="m-telefono" />
        </div>
        <div class="field">
          <label for="m-email">Email de acceso *</label>
          <input type="email" id="m-email" required />
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label id="m-pass-label" for="m-pass">Contraseña de acceso *</label>
          <div class="inline">
            <input type="text" id="m-pass" autocomplete="new-password" />
            <button class="btn btn-sm btn-secondary" type="button" onclick="generarClave()">Generar</button>
          </div>
        </div>
        <div class="field">
          <label for="m-duracion">Duración de cita (min) *</label>
          <input type="number" id="m-duracion" min="10" step="5" value="30" required />
        </div>
        <div class="field">
          <label for="m-buffer">Traslado domicilio (min)</label>
          <input type="number" id="m-buffer" min="0" step="5" value="30" title="Tiempo de buffer entre citas a domicilio" />
        </div>
      </div>
      <div class="field">
        <label>Horario principal (Lunes a Viernes) *</label>
        <div class="form-row">
          <div class="field">
            <label for="m-inicio" class="small muted">Hora inicio</label>
            <input type="time" id="m-inicio" value="08:00" required />
          </div>
          <div class="field">
            <label for="m-fin" class="small muted">Hora fin</label>
            <input type="time" id="m-fin" value="17:00" required />
          </div>
        </div>
      </div>
      <div class="field">
        <label for="m-sabado-toggle" class="small">
          <input type="checkbox" id="m-sabado-toggle" onchange="toggleSabado()" />
          Sábado con horario diferente
        </label>
        <div id="m-sabado-fields" class="form-row" style="display:none; margin-top:8px;">
          <div class="field">
            <label for="m-inicio-sabado" class="small muted">Inicio sábado</label>
            <input type="time" id="m-inicio-sabado" value="08:00" />
          </div>
          <div class="field">
            <label for="m-fin-sabado" class="small muted">Fin sábado</label>
            <input type="time" id="m-fin-sabado" value="12:00" />
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="m-descanso-inicio">Descanso — inicio</label>
          <input type="time" id="m-descanso-inicio" title="Hora de inicio del descanso (opcional)" />
        </div>
        <div class="field">
          <label for="m-descanso-fin">Descanso — fin</label>
          <input type="time" id="m-descanso-fin" title="Hora de fin del descanso (opcional)" />
        </div>
      </div>
      <div class="field">
        <label>Días de atención *</label>
        <div class="dias-grid">
          <label class="chip"><input type="checkbox" value="Lunes" checked /> Lunes</label>
          <label class="chip"><input type="checkbox" value="Martes" checked /> Martes</label>
          <label class="chip"><input type="checkbox" value="Miercoles" checked /> Miércoles</label>
          <label class="chip"><input type="checkbox" value="Jueves" checked /> Jueves</label>
          <label class="chip"><input type="checkbox" value="Viernes" checked /> Viernes</label>
          <label class="chip sabado-chip"><input type="checkbox" value="Sabado" id="m-chk-sabado" /> Sábado</label>
          <label class="chip"><input type="checkbox" value="Domingo" /> Domingo</label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
        <button class="btn" onclick="guardarMedico()">Guardar médico</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-cred" role="dialog" aria-modal="true" aria-label="Credenciales del médico">
    <div class="modal">
      <h3>Médico creado</h3>
      <p class="muted small">Comunica estos datos de acceso al médico:</p>
      <div id="cred-body"></div>
      <div class="modal-footer">
        <button class="btn" onclick="cerrarCred()">Entendido</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="vendor/supabase.min.js"></script>
  <script src="js/layout.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/medicos.js" defer></script>
  <script src="js/pwa.js" defer></script>
</body>
</html>
