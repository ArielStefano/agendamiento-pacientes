<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Médicos | Agendamiento de Pacientes</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CliniAgenda" />
</head>
<body data-title="Médicos">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="toolbar">
          <div class="left">
            <input type="search" id="buscar" class="search-input" placeholder="Buscar por nombre, especialidad o email..." />
          </div>
          <div class="right">
            <button class="btn" onclick="abrirModalMedico()">➕ Nuevo médico</button>
          </div>
        </div>
        <div id="tabla-medicos"></div>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal large">
      <h3 id="modal-titulo">Nuevo médico</h3>
      <input type="hidden" id="m-id" />
      <div class="form-row">
        <div class="field">
          <label>Nombre completo *</label>
          <input id="m-nombre" required />
        </div>
        <div class="field">
          <label>Especialidad *</label>
          <input id="m-especialidad" placeholder="Ej. Psicología" required />
        </div>
        <div class="field">
          <label>Teléfono</label>
          <input id="m-telefono" />
        </div>
        <div class="field">
          <label>Email de acceso *</label>
          <input type="email" id="m-email" required />
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label id="m-pass-label">Contraseña de acceso *</label>
          <div class="inline">
            <input type="text" id="m-pass" autocomplete="new-password" />
            <button class="btn btn-sm btn-secondary" type="button" onclick="generarClave()">Generar</button>
          </div>
        </div>
        <div class="field">
          <label>Duración de cita (min) *</label>
          <input type="number" id="m-duracion" min="10" step="5" value="30" required />
        </div>
        <div class="field">
          <label>Hora inicio *</label>
          <input type="time" id="m-inicio" value="08:00" required />
        </div>
        <div class="field">
          <label>Hora fin *</label>
          <input type="time" id="m-fin" value="17:00" required />
        </div>
      </div>
      <div class="field">
        <label>Días de atención *</label>
        <div class="dias-grid">
          <label class="chip"><input type="checkbox" value="Lunes" /> Lunes</label>
          <label class="chip"><input type="checkbox" value="Martes" /> Martes</label>
          <label class="chip"><input type="checkbox" value="Miercoles" /> Miércoles</label>
          <label class="chip"><input type="checkbox" value="Jueves" /> Jueves</label>
          <label class="chip"><input type="checkbox" value="Viernes" /> Viernes</label>
          <label class="chip"><input type="checkbox" value="Sabado" /> Sábado</label>
          <label class="chip"><input type="checkbox" value="Domingo" /> Domingo</label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
        <button class="btn" onclick="guardarMedico()">Guardar médico</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-cred">
    <div class="modal">
      <h3>Médico creado</h3>
      <p class="muted small">Comunica estos datos de acceso al médico:</p>
      <div id="cred-body"></div>
      <div class="modal-footer">
        <button class="btn" onclick="cerrarCred()">Entendido</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="vendor/supabase.min.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
  <script src="js/medicos.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
