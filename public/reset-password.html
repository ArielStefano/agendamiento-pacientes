<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nueva Contraseña | CliniAgenda</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CliniAgenda" />
  <link rel="preconnect" href="https://xgfwcrdrkzcoxepnicfb.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://xgfwcrdrkzcoxepnicfb.supabase.co" />
  <meta name="robots" content="noindex, nofollow" />
  <script src="js/security.js"></script>
</head>
<body class="login-body">
  <script>
    (function(){var t=localStorage.getItem("theme")||"light";document.documentElement.setAttribute("data-theme",t);})();
  </script>
  <button class="theme-toggle" id="theme-toggle" title="Cambiar tema" aria-label="Cambiar modo claro/oscuro" style="position:fixed;top:12px;right:12px;z-index:100"></button>
  <div class="login-card">
    <div class="login-logo">
      <span class="logo">🏥</span>
      <h1>CliniAgenda</h1>
    </div>
    <h2>Nueva contraseña</h2>

    <div id="alert" class="alert alert-error"></div>
    <div id="success" class="alert alert-success"></div>

    <form id="reset-form">
      <div class="field">
        <label for="password">Nueva contraseña</label>
        <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres" />
      </div>
      <div class="field">
        <label for="password2">Confirmar contraseña</label>
        <input type="password" id="password2" name="password2" required minlength="6" autocomplete="new-password" placeholder="Repita la contraseña" />
      </div>
      <button type="submit" id="btn-reset" class="btn btn-block">Guardar contraseña</button>
    </form>

    <p class="small muted text-center mt-8">
      <a href="index.html">← Volver al inicio de sesión</a>
    </p>
  </div>

  <script src="js/config.js"></script>
  <script src="vendor/supabase.min.js"></script>
  <script>
    const alertEl = document.getElementById("alert");
    const successEl = document.getElementById("success");

    if (!window.supabaseLib) {
      alertEl.textContent = "Error al cargar la librería. Recargue la página.";
      alertEl.classList.add("show");
    } else {
      const supabase = window.supabaseLib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      (async () => {
        const hash = window.location.hash;
        if (hash && hash.includes("access_token")) {
          const params = new URLSearchParams(hash.substring(1));
          const access_token = params.get("access_token");
          const refresh_token = params.get("refresh_token");
          if (access_token && refresh_token) {
            const { error } = await supabase.auth.setSession({ access_token, refresh_token });
            if (error) {
              alertEl.textContent = "El enlace expiró o no es válido. Solicite uno nuevo.";
              alertEl.classList.add("show");
            }
          }
        } else {
          alertEl.textContent = "Enlace no válido. Solicite uno nuevo desde 'Recuperar contraseña'.";
          alertEl.classList.add("show");
        }
      })();

      document.getElementById("reset-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const pw = document.getElementById("password").value;
        const pw2 = document.getElementById("password2").value;

        if (pw !== pw2) {
          alertEl.textContent = "Las contraseñas no coinciden.";
          alertEl.classList.add("show");
          return;
        }

        const btn = document.getElementById("btn-reset");
        btn.disabled = true;
        btn.textContent = "Guardando...";

        try {
          const { error } = await supabase.auth.updateUser({ password: pw });
          if (error) throw new Error(error.message);

          alertEl.classList.remove("show");
          successEl.textContent = "Contraseña actualizada correctamente. Será redirigido al inicio de sesión...";
          successEl.classList.add("show");
          setTimeout(() => { window.location.href = "index.html"; }, 2500);
        } catch (err) {
          successEl.classList.remove("show");
          alertEl.textContent = err.message;
          alertEl.classList.add("show");
        } finally {
          btn.disabled = false;
          btn.textContent = "Guardar contraseña";
        }
      });
    }
  </script>
  <script src="js/pwa.js" defer></script>
  <script>
    (function(){
      var b=document.getElementById("theme-toggle");
      var t=localStorage.getItem("theme")||"light";
      b.textContent=t==="dark"?"☀️":"🌙";
      b.addEventListener("click",function(){
        var c=document.documentElement.getAttribute("data-theme")||"light";
        var n=c==="dark"?"light":"dark";
        document.documentElement.setAttribute("data-theme",n);
        localStorage.setItem("theme",n);
        b.textContent=n==="dark"?"☀️":"🌙";
      });
    })();
  </script>
</body>
</html>
