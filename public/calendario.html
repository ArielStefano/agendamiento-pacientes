  <meta name="apple-mobile-web-app-title" content="CliniAgenda" />
  <link rel="preconnect" href="https://xgfwcrdrkzcoxepnicfb.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://xgfwcrdrkzcoxepnicfb.supabase.co" />
  <meta name="description" content="Calendario de citas médicas de CliniAgenda. Visualiza la agenda semanal y agenda nuevas consultas disponibles." />
  <script src="js/security.js"></script>
  <link rel="canonical" href="https://arielstefano.github.io/agendamiento-pacientes/calendario.html" />
  <meta property="og:type" content="website" />

  <meta property="og:image" content="https://arielstefano.github.io/agendamiento-pacientes/icons/icon-512.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Calendario | CliniAgenda" />

</head>
<body data-title="Calendario de médicos">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <h2 style="margin-bottom:12px">Calendario semanal</h2>
        <div class="calendar-toolbar">
          <select id="sel-medico" onchange="cargarSemana()" aria-label="Seleccionar médico"></select>
          <button class="btn btn-secondary btn-sm" onclick="cambiarSemana(-1)">← Semana</button>
          <button class="btn btn-secondary btn-sm" onclick="irHoy()">Hoy</button>
          <button class="btn btn-secondary btn-sm" onclick="cambiarSemana(1)">Semana →</button>
          <span id="semana-label" class="muted small"></span>
        </div>
        <div class="card" style="padding:0">
          <div class="table-wrap">
            <div id="calendario" class="calendar-grid"></div>
          </div>
        </div>
        <nav class="seo-links" style="margin-top:24px; padding:12px; border-top:1px solid var(--border); font-size:13px; color:var(--text-muted);" aria-label="Enlaces internos">
          <a href="dashboard.html" style="margin-right:12px;">Inicio</a>
          <a href="citas.html" style="margin-right:12px;">Citas</a>
          <a href="calendario.html" style="margin-right:12px;">Calendario</a>
          <a href="pacientes.html" style="margin-right:12px;">Pacientes</a>
          <a href="medicos.html">Médicos</a>
        </nav>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-detalle" role="dialog" aria-modal="true" aria-label="Detalle de la cita">
    <div class="modal">
      <h3>Detalle de la cita</h3>
      <div id="detalle-body"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-agendar" role="dialog" aria-modal="true" aria-label="Agendar cita">
    <div class="modal">
      <h3>Agendar cita</h3>
      <div id="agendar-info" class="mb-8"></div>
      <div class="field">
        <label for="ag-motivo">Motivo (opcional)</label>
        <input type="text" id="ag-motivo" placeholder="Ej. Consulta general" />
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarAgendar()">Cancelar</button>
        <button class="btn" id="btn-agendar" onclick="confirmarAgendar()">Confirmar cita</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="vendor/supabase.min.js"></script>
  <script src="js/layout.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/calendario.js" defer></script>
  <script src="js/pwa.js" defer></script>
</body>
</html>
