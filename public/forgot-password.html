<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Recuperar Contraseña | CliniAgenda</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CliniAgenda" />
  <link rel="preconnect" href="https://xgfwcrdrkzcoxepnicfb.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://xgfwcrdrkzcoxepnicfb.supabase.co" />
  <meta name="description" content="Recupera tu contraseña de CliniAgenda. Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña de forma segura." />
  <script src="js/security.js"></script>
  <link rel="canonical" href="https://arielstefano.github.io/agendamiento-pacientes/forgot-password.html" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_ES" />
  <meta property="og:site_name" content="CliniAgenda" />
  <meta property="og:title" content="Recuperar Contraseña | CliniAgenda" />
  <meta property="og:description" content="Recupera tu contraseña de CliniAgenda de forma rápida y segura." />
  <meta property="og:url" content="https://arielstefano.github.io/agendamiento-pacientes/forgot-password.html" />
  <meta property="og:image" content="https://arielstefano.github.io/agendamiento-pacientes/icons/icon-512.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Recuperar Contraseña | CliniAgenda" />
  <meta name="twitter:description" content="Recupera tu contraseña de CliniAgenda de forma rápida y segura." />
</head>
<body class="login-body">
  <script>
    (function(){var t=localStorage.getItem("theme")||"light";document.documentElement.setAttribute("data-theme",t);})();
  </script>
  <button class="theme-toggle" id="theme-toggle" title="Cambiar tema" aria-label="Cambiar modo claro/oscuro" style="position:fixed;top:12px;right:12px;z-index:100"></button>
  <div class="login-card">
    <div class="login-logo">
      <span class="logo">🏥</span>
      <h1>CliniAgenda</h1>
    </div>
    <h2>Recuperar contraseña</h2>

    <div id="alert" class="alert alert-error"></div>
    <div id="success" class="alert alert-success"></div>

    <form id="forgot-form">
      <div class="field">
        <label for="email">Correo o nombre de usuario</label>
        <input type="text" id="email" name="email" required autocomplete="username" placeholder="usuario o correo@ejemplo.com" />
      </div>
      <button type="submit" id="btn-reset" class="btn btn-block">Enviar enlace de recuperación</button>
    </form>

    <p class="small muted text-center mt-8">
      <a href="index.html">← Volver al inicio de sesión</a>
    </p>
  </div>

  <script src="js/config.js"></script>
  <script src="vendor/supabase.min.js"></script>
  <script>
    const alertEl = document.getElementById("alert");
    const successEl = document.getElementById("success");

    if (!window.supabaseLib) {
      alertEl.textContent = "Error al cargar la librería de Supabase. Recargue la página (Ctrl+F5).";
      alertEl.classList.add("show");
    } else {
      const supabase = window.supabaseLib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      document.getElementById("forgot-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btn-reset");
        btn.disabled = true;
        btn.textContent = "Enviando...";

        try {
          let input = document.getElementById("email").value.trim();
          if (!input) throw new Error("Ingrese su correo o nombre de usuario");

          // Si no contiene @, intentar resolver como nombre de usuario
          if (!input.includes("@")) {
            const { data: emailResolvido } = await supabase.rpc("resolver_email_por_usuario", { p_input: input });
            if (emailResolvido) {
              input = emailResolvido;
            } else {
              throw new Error("Nombre de usuario no encontrado");
            }
          }

          const { error } = await supabase.auth.resetPasswordForEmail(input, {
            redirectTo: window.location.origin + window.location.pathname.replace("forgot-password.html", "reset-password.html"),
          });
          if (error) throw new Error(error.message);

          alertEl.classList.remove("show");
          successEl.textContent = "Si el correo está registrado, recibirá un enlace para restablecer su contraseña. Revise su bandeja de entrada.";
          successEl.classList.add("show");
        } catch (err) {
          successEl.classList.remove("show");
          alertEl.textContent = err.message;
          alertEl.classList.add("show");
        } finally {
          btn.disabled = false;
          btn.textContent = "Enviar enlace de recuperación";
        }
      });
    }
  </script>
  <script src="js/pwa.js" defer></script>
  <script>
    (function(){
      var b=document.getElementById("theme-toggle");
      var t=localStorage.getItem("theme")||"light";
      b.textContent=t==="dark"?"☀️":"🌙";
      b.addEventListener("click",function(){
        var c=document.documentElement.getAttribute("data-theme")||"light";
        var n=c==="dark"?"light":"dark";
        document.documentElement.setAttribute("data-theme",n);
        localStorage.setItem("theme",n);
        b.textContent=n==="dark"?"☀️":"🌙";
      });
    })();
  </script>
</body>
</html>
