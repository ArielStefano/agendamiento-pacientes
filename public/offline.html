<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión | Clínica de Salud</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }
    .card {
      text-align: center;
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    .icon { font-size: 48px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #64748b; margin: 0 0 24px; font-size: 14px; }
    button {
      background: #0ea5e9;
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Sin conexión a internet</h1>
    <p>La aplicación está instalada, pero necesita conexión para acceder a los datos de Supabase.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
