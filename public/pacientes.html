<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pacientes | Agendamiento de Pacientes</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CliniAgenda" />
  <meta name="description" content="Administra el directorio de pacientes en CliniAgenda. Registra, edita y consulta historiales clínicos." />
  <link rel="canonical" href="https://arielstefano.github.io/agendamiento-pacientes/pacientes.html" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_ES" />
  <meta property="og:site_name" content="CliniAgenda" />
  <meta property="og:title" content="Pacientes | CliniAgenda" />
  <meta property="og:description" content="Administra el directorio de pacientes en CliniAgenda. Registra, edita y consulta historiales clínicos." />
  <meta property="og:url" content="https://arielstefano.github.io/agendamiento-pacientes/pacientes.html" />
  <meta property="og:image" content="https://arielstefano.github.io/agendamiento-pacientes/icons/icon-512.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Pacientes | CliniAgenda" />
  <meta name="twitter:description" content="Administra el directorio de pacientes en CliniAgenda. Registra, edita y consulta historiales clínicos." />
</head>
<body data-title="Pacientes">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <h2 style="margin-bottom:12px">Directorio de pacientes</h2>
        <div class="toolbar">
          <div class="left">
            <input type="search" id="buscar" class="search-input" placeholder="Buscar por nombre, documento, email o teléfono..." aria-label="Buscar pacientes" />
          </div>
          <div class="right">
            <button class="btn" onclick="abrirModalPaciente()">➕ Nuevo paciente</button>
          </div>
        </div>
        <div id="tabla-pacientes"></div>
        <nav class="seo-links" style="margin-top:24px; padding:12px; border-top:1px solid var(--border); font-size:13px; color:var(--text-muted);" aria-label="Enlaces internos">
          <a href="dashboard.html" style="margin-right:12px;">Inicio</a>
          <a href="citas.html" style="margin-right:12px;">Citas</a>
          <a href="calendario.html" style="margin-right:12px;">Calendario</a>
          <a href="pacientes.html" style="margin-right:12px;">Pacientes</a>
          <a href="medicos.html">Médicos</a>
        </nav>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal large">
      <h3 id="modal-titulo">Nuevo paciente</h3>
      <input type="hidden" id="p-id" />
      <div class="form-row">
        <div class="field">
          <label for="p-nombre">Nombre completo *</label>
          <input id="p-nombre" required />
        </div>
        <div class="field">
          <label for="p-documento">Documento</label>
          <input id="p-documento" />
        </div>
        <div class="field">
          <label for="p-email">Email</label>
          <input type="email" id="p-email" />
        </div>
        <div class="field">
          <label for="p-telefono">Teléfono</label>
          <input id="p-telefono" />
        </div>
        <div class="field">
          <label for="p-nacimiento">Fecha de nacimiento</label>
          <input type="date" id="p-nacimiento" />
        </div>
        <div class="field">
          <label for="p-direccion">Dirección</label>
          <input id="p-direccion" />
        </div>
      </div>
      <div class="field">
        <label for="p-alergias">Alergias</label>
        <input id="p-alergias" />
      </div>
      <div class="field">
        <label for="p-notas">Notas</label>
        <textarea id="p-notas" rows="2"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
        <button class="btn" onclick="guardarPaciente()">Guardar</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-detalle" role="dialog" aria-modal="true" aria-label="Detalle del paciente">
    <div class="modal large">
      <h3>Detalle del paciente</h3>
      <div id="detalle-body"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="vendor/supabase.min.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pacientes.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
