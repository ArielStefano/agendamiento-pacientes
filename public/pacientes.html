<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pacientes | Agendamiento de Pacientes</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Clínica Salud" />
</head>
<body data-title="Pacientes">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="toolbar">
          <div class="left">
            <input type="search" id="buscar" class="search-input" placeholder="Buscar por nombre, documento, email o teléfono..." />
          </div>
          <div class="right">
            <button class="btn" onclick="abrirModalPaciente()">➕ Nuevo paciente</button>
          </div>
        </div>
        <div id="tabla-pacientes"></div>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal large">
      <h3 id="modal-titulo">Nuevo paciente</h3>
      <input type="hidden" id="p-id" />
      <div class="form-row">
        <div class="field">
          <label>Nombre completo *</label>
          <input id="p-nombre" required />
        </div>
        <div class="field">
          <label>Documento</label>
          <input id="p-documento" />
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="p-email" />
        </div>
        <div class="field">
          <label>Teléfono</label>
          <input id="p-telefono" />
        </div>
        <div class="field">
          <label>Fecha de nacimiento</label>
          <input type="date" id="p-nacimiento" />
        </div>
        <div class="field">
          <label>Dirección</label>
          <input id="p-direccion" />
        </div>
      </div>
      <div class="field">
        <label>Alergias</label>
        <input id="p-alergias" />
      </div>
      <div class="field">
        <label>Notas</label>
        <textarea id="p-notas" rows="2"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
        <button class="btn" onclick="guardarPaciente()">Guardar</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-detalle">
    <div class="modal large">
      <h3>Detalle del paciente</h3>
      <div id="detalle-body"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="vendor/supabase.min.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pacientes.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
