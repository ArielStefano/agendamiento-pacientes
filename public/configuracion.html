<body data-title="Configuración">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <h2 style="margin-bottom:16px">Configuración del sistema</h2>

        <div class="grid grid-2">
          <div class="card">
            <h3 style="margin-bottom:14px">🏢 Datos de la clínica</h3>
            <div class="field">
              <label for="cfg-clinica-nombre">Nombre de la clínica</label>
              <input type="text" id="cfg-clinica-nombre" placeholder="Ej. Clínica San Rafael" />
            </div>
            <div class="field">
              <label for="cfg-clinica-telefono">Teléfono de contacto</label>
              <input type="tel" id="cfg-clinica-telefono" placeholder="Ej. 02 123 4567" />
            </div>
            <div class="field">
              <label for="cfg-clinica-direccion">Dirección</label>
              <input type="text" id="cfg-clinica-direccion" placeholder="Ej. Av. Principal 123" />
            </div>
          </div>

          <div class="card">
            <h3 style="margin-bottom:14px">🔒 Privacidad y seguridad</h3>
            <div class="field">
              <label>
                <input type="checkbox" id="cfg-anonimizar" style="margin-right:8px" />
                Los pacientes solo ven sus propias citas (otros aparecen como "Reservado")
              </label>
            </div>
          </div>

          <div class="card">
            <h3 style="margin-bottom:14px">⏱️ Valores predeterminados</h3>
            <div class="field">
              <label for="cfg-duracion">Duración default de citas (minutos)</label>
              <input type="number" id="cfg-duracion" min="15" max="180" step="5" />
            </div>
            <div class="field">
              <label for="cfg-buffer">Buffer traslado domicilio (minutos)</label>
              <input type="number" id="cfg-buffer" min="0" max="120" step="5" />
            </div>
          </div>

          <div class="card">
            <h3 style="margin-bottom:14px">🔔 Recordatorios</h3>
            <div class="field">
              <label for="cfg-recordatorios-horas">Horas antes para generar recordatorios</label>
              <input type="number" id="cfg-recordatorios-horas" min="1" max="168" step="1" />
            </div>
          </div>
        </div>

        <div style="margin-top:16px; text-align:right">
          <button class="btn" id="btn-guardar" onclick="guardarConfig()">Guardar configuración</button>
        </div>

        <nav class="seo-links" style="margin-top:24px; padding:12px; border-top:1px solid var(--border); font-size:13px; color:var(--text-muted);" aria-label="Enlaces internos">
          <a href="dashboard.html" style="margin-right:12px;">Inicio</a>
          <a href="citas.html" style="margin-right:12px;">Citas</a>
          <a href="calendario.html" style="margin-right:12px;">Calendario</a>
          <a href="pacientes.html" style="margin-right:12px;">Pacientes</a>
          <a href="medicos.html">Médicos</a>
        </nav>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="vendor/supabase.min.js"></script>
  <script src="js/layout.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/configuracion.js" defer></script>
  <script src="js/pwa.js" defer></script>
</body>
