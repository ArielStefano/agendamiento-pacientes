<body class="login-body">
  <script>
    (function(){var t=localStorage.getItem("theme")||"light";document.documentElement.setAttribute("data-theme",t);})();
  </script>
  <button class="theme-toggle" id="theme-toggle" title="Cambiar tema" aria-label="Cambiar modo claro/oscuro" style="position:fixed;top:12px;right:12px;z-index:100"></button>
  <div class="login-card">
    <div class="login-logo">
      <span class="logo">🏥</span>
      <h1>CliniAgenda</h1>
    </div>
    <h2>Sistema de Agendamiento de Pacientes</h2>

    <div id="alert" class="alert alert-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required autocomplete="username" placeholder="usuario@clinica.com" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button type="submit" id="btn-login" class="btn btn-block">Iniciar sesión</button>
    </form>

    <p class="small muted text-center mt-8">
      <a href="forgot-password.html">¿Olvidó su contraseña?</a>
    </p>
    <p class="small muted text-center mt-8">
      ¿Es paciente o representante? <a href="registro.html">Cree su cuenta aquí</a>
    </p>
  </div>

  <script src="js/config.js"></script>
  <script src="vendor/supabase.min.js"></script>
  <script>
    const alertEl = document.getElementById("alert");
    if (!window.supabaseLib) {
      alertEl.textContent = "Error al cargar la librería de Supabase. Recargue la página (Ctrl+F5).";
      alertEl.classList.add("show");
    } else {
      const supabase = window.supabaseLib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      (async () => {
        try {
          const { data } = await supabase.auth.getSession();
          if (data.session) window.location.href = "dashboard.html";
        } catch (e) {}
      })();

      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btn-login");
        btn.disabled = true;
        btn.textContent = "Ingresando...";

        try {
          const { data, error } = await supabase.auth.signInWithPassword({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          });
          if (error) throw new Error("Correo o contraseña incorrectos");
          alertEl.classList.remove("show");
          window.location.href = "dashboard.html";
        } catch (err) {
          alertEl.textContent = err.message;
          alertEl.classList.add("show");
        } finally {
          btn.disabled = false;
          btn.textContent = "Iniciar sesión";
        }
      });
    }
  </script>
  <script src="js/pwa.js" defer></script>
  <script>
    (function(){
      var b=document.getElementById("theme-toggle");
      var t=localStorage.getItem("theme")||"light";
      b.textContent=t==="dark"?"☀️":"🌙";
      b.addEventListener("click",function(){
        var c=document.documentElement.getAttribute("data-theme")||"light";
        var n=c==="dark"?"light":"dark";
        document.documentElement.setAttribute("data-theme",n);
        localStorage.setItem("theme",n);
        b.textContent=n==="dark"?"☀️":"🌙";
      });
    })();
  </script>
</body>
</html>
