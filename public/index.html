<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso | Agendamiento de Pacientes</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo">🏥</span>
      <h1>Clínica de Salud</h1>
    </div>
    <h2>Sistema de Agendamiento de Pacientes</h2>

    <div id="alert" class="alert alert-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required autocomplete="username" placeholder="usuario@clinica.com" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button type="submit" id="btn-login" class="btn btn-block">Iniciar sesión</button>
    </form>

    <div class="demo-accounts">
      <strong>Cuentas de demostración:</strong><br />
      <code>admin@clinica.com / admin123</code><br />
      <code>recepcion@clinica.com / recepcion123</code><br />
      <code>ana@clinica.com / medico123</code>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    (async () => {
      try {
        const { data } = await supabase.auth.getSession();
        if (data.session) window.location.href = "dashboard.html";
      } catch (e) {}
    })();

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById("alert");
      const btn = document.getElementById("btn-login");
      btn.disabled = true;
      btn.textContent = "Ingresando...";

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        });
        if (error) throw new Error("Correo o contraseña incorrectos");
        alertEl.classList.remove("show");
        window.location.href = "dashboard.html";
      } catch (err) {
        alertEl.textContent = err.message;
        alertEl.classList.add("show");
      } finally {
        btn.disabled = false;
        btn.textContent = "Iniciar sesión";
      }
    });
  </script>
</body>
</html>
