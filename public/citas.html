<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CliniAgenda" />
  <link rel="preconnect" href="https://xgfwcrdrkzcoxepnicfb.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://xgfwcrdrkzcoxepnicfb.supabase.co" />
  <meta name="description" content="Gestiona todas tus citas médicas en CliniAgenda: crea, edita, confirma o cancela consultas. Filtra por médico, paciente, fecha y estado." />
  <script src="js/security.js"></script>
  <link rel="canonical" href="https://arielstefano.github.io/agendamiento-pacientes/citas.html" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_ES" />
  <meta property="og:site_name" content="CliniAgenda" />
  <meta property="og:title" content="Citas | CliniAgenda" />
  <meta property="og:description" content="Gestiona las citas médicas en CliniAgenda. Crea, edita, confirma y administra consultas con médicos especialistas." />
  <meta property="og:url" content="https://arielstefano.github.io/agendamiento-pacientes/citas.html" />
  <meta property="og:image" content="https://arielstefano.github.io/agendamiento-pacientes/icons/icon-512.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Citas | CliniAgenda" />
  <meta name="twitter:description" content="Gestiona las citas médicas en CliniAgenda. Crea, edita, confirma y administra consultas con médicos especialistas." />
</head>
<body data-title="Gestión de citas">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <h2 style="margin-bottom:12px">Gestión de citas</h2>
        <div class="toolbar">
          <div class="left">
            <select id="f-medico" onchange="aplicarFiltros()" aria-label="Filtrar por médico"><option value="">Todos los médicos</option></select>
            <select id="f-estado" onchange="aplicarFiltros()" aria-label="Filtrar por estado">
              <option value="">Todos los estados</option>
              <option value="solicitada">Solicitada</option>
              <option value="programada">Programada</option>
              <option value="confirmada">Confirmada</option>
              <option value="completada">Completada</option>
              <option value="cancelada">Cancelada</option>
            </select>
            <input type="date" id="f-desde" onchange="aplicarFiltros()" aria-label="Fecha desde" />
            <input type="date" id="f-hasta" onchange="aplicarFiltros()" aria-label="Fecha hasta" />
          </div>
          <div class="right">
            <button class="btn" onclick="abrirModalCita()">➕ Nueva cita</button>
          </div>
        </div>
        <div id="tabla-citas"></div>
        <nav class="seo-links" style="margin-top:24px; padding:12px; border-top:1px solid var(--border); font-size:13px; color:var(--text-muted);" aria-label="Enlaces internos">
          <a href="dashboard.html" style="margin-right:12px;">Inicio</a>
          <a href="citas.html" style="margin-right:12px;">Citas</a>
          <a href="calendario.html" style="margin-right:12px;">Calendario</a>
          <a href="pacientes.html" style="margin-right:12px;">Pacientes</a>
          <a href="medicos.html">Médicos</a>
        </nav>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-cita" role="dialog" aria-modal="true" aria-labelledby="cita-titulo">
    <div class="modal large">
      <h3 id="cita-titulo">Nueva cita</h3>
      <input type="hidden" id="c-id" />
      <div class="form-row">
        <div class="field">
          <label for="c-paciente">Paciente *</label>
          <select id="c-paciente"></select>
        </div>
        <div class="field">
          <label for="c-medico">Médico *</label>
          <select id="c-medico" onchange="cargarDisponibilidad()"></select>
        </div>
        <div class="field">
          <label for="c-fecha">Fecha *</label>
          <input type="date" id="c-fecha" min="" onchange="cargarDisponibilidad()" />
        </div>
        <div class="field">
          <label for="c-motivo">Motivo</label>
          <input id="c-motivo" placeholder="Ej. Consulta de control" />
        </div>
        <div class="field">
          <label for="c-lugar">Lugar *</label>
          <select id="c-lugar">
            <option value="consultorio">En consultorio</option>
            <option value="domicilio">A domicilio</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Horarios disponibles</label>
        <div id="slots" class="slot-grid"><span class="muted small">Seleccione médico y fecha para ver horarios.</span></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModalCita()">Cancelar</button>
        <button class="btn" onclick="guardarCita()">Guardar cita</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="vendor/supabase.min.js"></script>
  <script src="js/layout.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/citas.js" defer></script>
  <script src="js/pwa.js" defer></script>
</body>
</html>
