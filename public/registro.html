<head>

  <meta name="apple-mobile-web-app-capable" content="yes" />

  <meta name="apple-mobile-web-app-title" content="CliniAgenda" />

  <link rel="dns-prefetch" href="https://xgfwcrdrkzcoxepnicfb.supabase.co" />
  <meta name="description" content="Crea tu cuenta gratuita en CliniAgenda y agenda citas médicas online las 24 horas. Registro rápido para pacientes y representantes." />
  <script src="js/security.js"></script>
  <link rel="canonical" href="https://arielstefano.github.io/agendamiento-pacientes/registro.html" />
  <meta property="og:type" content="website" />

  <meta property="og:site_name" content="CliniAgenda" />
  <meta property="og:title" content="Registro de pacientes | CliniAgenda" />
  <meta property="og:description" content="Regístrate como paciente en CliniAgenda. Crea tu cuenta gratuita para agendar citas médicas online las 24 horas." />
  <meta property="og:url" content="https://arielstefano.github.io/agendamiento-pacientes/registro.html" />
  <meta property="og:image" content="https://arielstefano.github.io/agendamiento-pacientes/icons/icon-512.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Registro de pacientes | CliniAgenda" />
  <meta name="twitter:description" content="Regístrate como paciente en CliniAgenda. Crea tu cuenta gratuita para agendar citas médicas online las 24 horas." />
</head>
<body class="login-body">
  <script>
    (function(){var t=localStorage.getItem("theme")||"light";document.documentElement.setAttribute("data-theme",t);})();
  </script>
  <button class="theme-toggle" id="theme-toggle" title="Cambiar tema" aria-label="Cambiar modo claro/oscuro" style="position:fixed;top:12px;right:12px;z-index:100"></button>
  <div class="login-card">
    <div class="login-logo">
      <span class="logo">🏥</span>
      <h1>CliniAgenda</h1>
    </div>
    <h2>Crear cuenta</h2>
      <p class="small muted">Si es representante, ingrese los datos del paciente y el suyo. Elige un nombre de usuario para iniciar sesión.</p>

    <div id="alert" class="alert alert-error"></div>
    <div id="ok" class="alert alert-success"></div>

    <form id="registro-form">
      <div class="field">
        <label for="tipo_cuenta">¿Quién usa esta cuenta? *</label>
        <select id="tipo_cuenta" name="tipo_cuenta" required>
          <option value="paciente">El paciente mismo</option>
          <option value="representante">Soy representante del paciente</option>
        </select>
      </div>
      <div class="field hidden" id="rep-field">
        <label for="nombre_cuenta">Nombre del representante *</label>
        <input type="text" id="nombre_cuenta" name="nombre_cuenta" autocomplete="off" placeholder="Nombre de quien usa esta cuenta" />
      </div>
      <div class="field">
        <label for="nombre">Nombre del paciente *</label>
        <input type="text" id="nombre" name="nombre" required autocomplete="off" placeholder="Nombre completo" />
      </div>
      <div class="field">
        <label for="telefono">Teléfono (opcional)</label>
        <input type="tel" id="telefono" name="telefono" autocomplete="off" placeholder="Ej. 099 123 4567" />
      </div>
      <div class="field">
        <label for="username">Nombre de usuario *</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="Ej. juan_perez" pattern="[a-z0-9._\-]{3,30}" minlength="3" maxlength="30" />
        <span class="small muted">Solo letras, números, puntos o guiones (3-30 caracteres)</span>
      </div>
      <div class="field">
        <label for="contrasena">Contraseña *</label>
        <input type="password" id="contrasena" name="contrasena" required minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres" />
      </div>
      <button type="submit" id="btn-registro" class="btn btn-block">Crear cuenta</button>
    </form>

    <p class="small muted text-center mt-8">
      ¿Ya tiene cuenta? <a href="index.html">Iniciar sesión</a>
    </p>
  </div>

  <script src="js/config.js"></script>
  <script src="vendor/supabase.min.js"></script>
  <script src="js/registro.js" defer></script>
  <script src="js/pwa.js" defer></script>
  <script>
    (function(){
      var b=document.getElementById("theme-toggle");
      var t=localStorage.getItem("theme")||"light";
      b.textContent=t==="dark"?"☀️":"🌙";
      b.addEventListener("click",function(){
        var c=document.documentElement.getAttribute("data-theme")||"light";
        var n=c==="dark"?"light":"dark";
        document.documentElement.setAttribute("data-theme",n);
        localStorage.setItem("theme",n);
        b.textContent=n==="dark"?"☀️":"🌙";
      });
    })();
  </script>
</body>
</html>
